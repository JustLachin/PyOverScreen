name: Build Release Artifacts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: windows-x64, runner: windows-2025, arch: x64, extension: zip}
          - {target: linux-x64, runner: ubuntu-22.04, arch: x64, extension: tar.gz}
          - {target: linux-arm64, runner: ubuntu-24.04-arm, arch: arm64, extension: tar.gz}
          - {target: macos-x64, runner: macos-15-intel, arch: x64, extension: zip}
          - {target: macos-arm64, runner: macos-26, arch: arm64, extension: zip}
    env:
      ARCHIVE: PyOverScreen-${{ matrix.target }}.${{ matrix.extension }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch }}
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install Linux GUI and test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          minizip=libminizip1
          if [ "$(lsb_release -rs)" = "24.04" ]; then
            minizip=libminizip1t64
          fi
          sudo apt-get install -y xvfb xauth libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libegl1 libgl1 libgbm1 libnss3 libpulse0 libpipewire-0.3-0 \
            libgstreamer-plugins-base1.0-0 libgstreamer-plugins-bad1.0-0 "$minizip"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build Windows package
        if: runner.os == 'Windows'
        run: ./scripts/build-windows.ps1
      - name: Build Linux or macOS package
        if: runner.os != 'Windows'
        run: bash scripts/build-unix.sh
      - name: Launch the extracted Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "artifacts/$env:ARCHIVE"
          $extracted = Join-Path $env:RUNNER_TEMP 'pyoverscreen-smoke'
          Expand-Archive -LiteralPath $archive -DestinationPath $extracted -Force
          $exe = Join-Path $extracted 'PyOverScreen/PyOverScreen.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -WorkingDirectory $env:RUNNER_TEMP -PassThru
          try {
              if (-not $process.WaitForExit(45000)) {
                  throw 'The packaged application did not finish its startup test.'
              }
              if ($process.ExitCode -ne 0) {
                  throw "The packaged application failed its startup test (exit $($process.ExitCode))."
              }
          } finally {
              if (-not $process.HasExited) {
                  taskkill /PID $process.Id /T /F
              }
          }
      - name: Launch the extracted Linux application
        if: runner.os == 'Linux'
        shell: bash
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: |
          stage="$(mktemp -d)"
          tar -xzf "artifacts/$ARCHIVE" -C "$stage"
          cd "$RUNNER_TEMP"
          timeout 60s xvfb-run -a "$stage/PyOverScreen/PyOverScreen" --smoke-test
      - name: Launch the extracted macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          stage="$(mktemp -d)"
          ditto -x -k "artifacts/$ARCHIVE" "$stage"
          cd "$RUNNER_TEMP"
          python -c 'import subprocess, sys; subprocess.run(sys.argv[1:], check=True, timeout=60)' \
            "$stage/PyOverScreen.app/Contents/MacOS/PyOverScreen" --smoke-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: PyOverScreen-${{ matrix.target }}
          path: |
            artifacts/${{ env.ARCHIVE }}
            artifacts/${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 30
